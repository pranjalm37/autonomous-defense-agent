# nginx config for the AADA frontend container.
# - Serves the built SPA with history-API fallback (deep links work on refresh).
# - Reverse-proxies /api/* to the backend service on the compose network, so the
#   browser only ever talks to one origin (no CORS, no exposed backend port needed).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # API → backend service (Docker DNS resolves "backend" on the shared network).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream-friendly (future WebSocket / SSE endpoints)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # Cache hashed static assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unknown path serves index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

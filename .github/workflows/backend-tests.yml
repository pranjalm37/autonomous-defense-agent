name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "aada-backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "aada-backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aada-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests with coverage
        run: poetry run pytest tests/ -q --ignore=tests/test_auth.py --cov=app --cov-report=term-missing

      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          poetry run coverage report >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aada-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dev dependencies
        run: poetry install --only dev --no-interaction

      - name: Run Ruff
        run: poetry run ruff check .

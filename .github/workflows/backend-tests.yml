name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "aada-backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "aada-backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aada-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest tests/ -q --ignore=tests/test_auth.py

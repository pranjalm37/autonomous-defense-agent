name: Frontend build

on:
  push:
    branches: [main]
    paths:
      - "aada-frontend/**"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "aada-frontend/**"
      - ".github/workflows/frontend-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aada-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: aada-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

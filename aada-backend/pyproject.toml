[tool.poetry]
name = "aada-backend"
version = "0.1.0"
description = "AI Autonomous Defense Agent — Backend"
authors = ["SOC Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = ">=0.29,<0.32"          # async PostgreSQL driver
alembic = "^1.13.0"
pydantic-settings = "^2.2.0"
email-validator = "^2.1.0"   # required by pydantic EmailStr
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = ">=4.0,<4.1"        # passlib 1.7.4 reads bcrypt.__about__, removed in 4.1+
python-multipart = ">=0.0.9,<0.0.33"  # form data (login) + file uploads (event ingestion)
structlog = "^24.1.0"        # structured JSON logging
# ── AI / RAG ──
openai = "^1.40.0"           # embeddings + (later) chat completions
chromadb = "0.5.23"          # vector store (pin to match chromadb/chroma server image)
mcp = "^1.2.0"               # Model Context Protocol server (security tools)
httpx = "^0.27.0"            # async HTTP client for external API integrations
pyyaml = "^6.0"              # parse Sigma rules
tiktoken = ">=0.7,<0.15"          # token counting for chunk sizing

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = ">=0.23,<1.5"
pytest-cov = "^5.0.0"
ruff = "^0.4.0"              # lint + format

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["app/mcp_server/server.py"]  # stdio entrypoint, not exercised by the offline suite

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Docstring shows a literal example log line — wrapping it would misrepresent
# the format it's documenting.
"app/services/ingestion/parsers/auth_parser.py" = ["E501"]

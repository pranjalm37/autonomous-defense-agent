services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aada
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: aada_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aada"]
      interval: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app  # live reload in dev

volumes:
  pgdata:
